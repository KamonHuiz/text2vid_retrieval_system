# Shared benchmark/evaluation defaults.

seed: 42
benchmark_fraction: 0.05            # exactly 5% held out per subset "L"
per_device_batch_size: 256          # eval batch size (no gradients, can be larger than train)
num_workers: 8
precision: bf16

metrics:
  - recall@1
  - recall@5
  - recall@10
  - mrr
  - mean_rank

# Retrieval is evaluated in both directions.
directions:
  - image_to_text
  - text_to_image

output:
  metrics_filename_template: "{phase}_metrics.json"   # phase in {baseline, finetuned}
  comparison_csv: results_comparison.csv
  comparison_markdown: results_comparison.md
